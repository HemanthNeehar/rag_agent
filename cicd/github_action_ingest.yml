name: Automated RAG Knowledge Ingestion Pipeline

on:
  schedule:
    # Run every night at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual execution from the GitHub Actions UI
    inputs:
      force_reingest:
        description: 'Force re-ingestion of all cached files?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  id-token: write  # Required for GCP Workload Identity Federation

jobs:
  ingest_and_sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y google-cloud-cli

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r rag_agent/requirements.txt
        pip install pypdf python-docx python-pptx pandas openpyxl xlrd tabulate

    - name: Authenticate to Google Cloud (Workload Identity Federation)
      uses: google-github-actions/auth@v2
      with:
        # Recommended Enterprise Security Practice (No static keys)
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    # ALTERNATIVE static key option (if Workload Identity is not set up):
    # - name: Authenticate to Google Cloud (Service Account Key)
    #   uses: google-github-actions/auth@v2
    #   with:
    #     credentials_json: ${{ secrets.GCP_SA_KEY_JSON }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Run Ingestion and Push to RAG Engine
      working-directory: rag_agent
      env:
        # GCP Config
        RAG_GCS_BUCKET_NAME: ${{ secrets.RAG_GCS_BUCKET_NAME }}
        VERTEX_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        VERTEX_LOCATION: ${{ secrets.GCP_LOCATION }}
        RAG_ENGINE_ID: ${{ secrets.RAG_ENGINE_ID }}
        
        # Gemini Config
        GEMINI_MODEL: "gemini-2.5-flash"
        
        # Confluence Config
        CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
        CONFLUENCE_USERNAME: ${{ secrets.CONFLUENCE_USERNAME }}
        CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        CONFLUENCE_SPACES: ${{ secrets.CONFLUENCE_SPACES }}
        
        # SharePoint Config
        SHAREPOINT_INGEST_MODE: "graph_api"
        SHAREPOINT_INGEST_CONCURRENCY: "5"
        SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
        SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
        SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
        SHAREPOINT_SITE_SEARCH_QUERY: "*"
        FORCE_REINGEST: ${{ github.event.inputs.force_reingest || 'false' }}
      run: |
        echo "Starting SharePoint Ingestion..."
        python ingest_sharepoint_gcs.py
        
        echo "Starting Confluence Ingestion..."
        python ingest_gcs.py
        
        echo "Pushing Extracted Documents to RAG Engine..."
        python push_rag_engine.py
